<title>KÖK Cafe Lounge Menü</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..700&family=Karla:ital,wght@0,300..800;1,300..700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap"><style>:root{
  --ground:#F0EDE6; --raised:#F9F7F2; --ink:#221F19; --ink-2:#585349; --ink-3:#807A6C;
  --line:#DAD5C8; --line-2:#C3BCAB; --gold:#82683D; --gold-soft:#EFE8D9; --price:#7C5C22;
  --chip:#E6E1D4; --shadow:rgba(50,42,26,.18); --wa:#1F9E52; --ig:#C13584; --gg:#3C6FD1; --danger:#B3342E;
  color-scheme:light; --stick:54px; --maxw:760px;
  --t1:#F1EADA; --k1:#8A6C36;  --t2:#E9EDDF; --k2:#5E7040;  --t3:#F1E7DE; --k3:#91694A;
  --t4:#F2EBD9; --k4:#8B7233;  --t5:#F2E7DD; --k5:#966147;  --t6:#F1E7E6; --k6:#92585E;
  --t7:#EDE6DC; --k7:#75603F;  --t8:#E4EBE9; --k8:#4C7568;  --t9:#E9E7E3; --k9:#6A6152;
  --serif:"Alegreya",Georgia,serif; --sans:"Karla","Helvetica Neue",Arial,sans-serif;
}
[dir=rtl]{--serif:"Amiri","Alegreya",Georgia,serif; --sans:"Tajawal","Karla",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(11rem + env(safe-area-inset-bottom))}
img{max-width:100%}
[hidden]{display:none!important}
button,input,a,textarea,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
[dir=rtl] .sec-title,[dir=rtl] .tagline,[dir=rtl] .bless{font-weight:700}
[dir=rtl] .chip,[dir=rtl] .grp-label,[dir=rtl] .sec-sub,[dir=rtl] .more,[dir=rtl] .flabel,[dir=rtl] .dblock h4{letter-spacing:0}

/* hero */
.hero{padding:30px 0 20px;text-align:center}
.logo{width:min(76%,290px);aspect-ratio:var(--logo-ar,560/403);margin:0 auto;background-color:var(--gold);
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;cursor:default;user-select:none;-webkit-user-select:none}
.tagline{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--ink-2);margin:18px 0 0}
[dir=rtl] .tagline{font-style:normal}
.meta{margin:12px 0 0;font-size:.82rem;color:var(--ink-3);line-height:1.8}
.meta a{color:var(--gold);text-decoration:none;font-weight:700}
.meta #phone{white-space:nowrap}
.meta .sep{opacity:.45;margin:0 7px}

/* sticky bar */
.bar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:8px;height:var(--stick);padding:0 10px 0 18px}
[dir=rtl] .bar-in{padding:0 18px 0 10px}
.rail{flex:1;min-width:0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;padding-inline-end:14px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent)}
[dir=rtl] .rail{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 34px),transparent)}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:.77rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:none;border:0;
  padding:16px 0 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-inline-end:16px;transition:color .16s}
.chip[aria-current="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.iconbtn{position:relative;width:36px;height:36px;display:grid;place-items:center;background:none;border:1px solid var(--line-2);border-radius:50%;color:var(--ink-2);cursor:pointer;padding:0}
.iconbtn svg{width:16px;height:16px}
.iconbtn[aria-expanded="true"]{background:var(--gold);border-color:var(--gold);color:var(--ground)}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--price);color:#fff;font-size:.6rem;font-weight:700;display:none;padding:0 4px;line-height:16px}
.iconbtn.has .dot{display:block}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.lang button{font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:9px 8px;border:0;background:none;color:var(--ink-3);cursor:pointer;min-width:34px}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ground)}

/* arama + filtre paneli */
.panel{border-bottom:1px solid var(--line);background:var(--raised)}
.panel .wrap{padding-top:14px;padding-bottom:16px}
#q{width:100%;font-size:1rem;background:var(--ground);border:1px solid var(--line-2);border-radius:8px;padding:11px 13px}
#q::placeholder{color:var(--ink-3)}
.flabel{font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 9px}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
.fchip{font-size:.79rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--ground);color:var(--ink-2);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ground)}
.hits{font-size:.78rem;color:var(--ink-3);margin-top:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.clear{background:none;border:0;color:var(--gold);font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:underline}

/* bölümler */
.sec{scroll-margin-top:calc(var(--stick) + 2px);padding-top:34px}
.sec-head{display:flex;align-items:center;gap:13px;margin-bottom:3px}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line-2)}
.sec-title{font-family:var(--serif);font-weight:800;font-size:1.65rem;line-height:1.1;margin:0;text-wrap:balance}
.sec-sub{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px}
.grp{margin-top:22px}
.grp-label{font-size:.69rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;display:flex;align-items:center;gap:9px}
.grp-label::before{content:"";width:13px;height:1px;background:var(--gold);flex:0 0 auto}
.grp-note{font-family:var(--serif);font-style:italic;font-size:.82rem;color:var(--ink-3);margin:-2px 0 8px;padding-inline-start:22px}
[dir=rtl] .grp-note{font-style:normal}

/* ürün satırı */
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.irow{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;padding:12px 0;cursor:pointer}
.irow:active{opacity:.7}
.thumb{flex:0 0 auto;width:64px;height:64px;border-radius:12px;background:var(--tint);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:40px;height:40px;color:var(--tink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ibody{flex:1;min-width:0;padding-top:2px}
.line{display:flex;align-items:baseline;gap:8px}
.nm{font-weight:600;font-size:.98rem;letter-spacing:-.005em;line-height:1.3}
.badge{display:inline-block;vertical-align:.1em;font-size:.55rem;font-weight:700;letter-spacing:.11em;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:1px 4px;margin-inline-start:6px}
.badge.out{color:var(--danger);border-color:var(--danger)}
.dots{flex:1;min-width:10px;border-bottom:1px dotted var(--line-2);transform:translateY(-4px)}
.pr{flex:0 0 auto;white-space:nowrap;font-weight:700;font-size:.94rem;color:var(--price);font-variant-numeric:tabular-nums;direction:ltr}
.pr .cur{font-weight:500;font-size:.8em}
.item.so .thumb{filter:grayscale(1);opacity:.55}
.item.so .nm{color:var(--ink-3)}
.item.so .pr{text-decoration:line-through;color:var(--ink-3)}
.desc{margin:3px 0 0;font-size:.83rem;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.more{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:.71rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
.more svg{width:10px;height:10px;transition:transform .24s}
.item.open .more svg{transform:rotate(180deg)}
.item.open .desc{display:none}

/* açılır detay */
.idet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.item.open .idet{grid-template-rows:1fr}
.idet>div{overflow:hidden}
.idin{padding:0 0 16px;padding-inline-start:77px}
.item.open .idin{padding-top:4px}
.photo{width:100%;max-width:330px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--tint)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.dblock{margin-bottom:14px}
.dblock:last-of-type{margin-bottom:0}
.dblock h4{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.dblock p{margin:0;font-size:.88rem;line-height:1.55;color:var(--ink-2)}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.achip{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;background:var(--chip);border-radius:7px;padding:5px 10px 5px 6px;color:var(--ink)}
[dir=rtl] .achip{padding:5px 6px 5px 10px}
.achip b{display:grid;place-items:center;min-width:19px;height:19px;padding:0 3px;border-radius:5px;background:var(--price);color:#fff;font-size:.58rem;font-weight:800;direction:ltr}
.snone{font-size:.86rem;color:var(--ink-3);font-style:italic;font-family:var(--serif);margin:0}
[dir=rtl] .snone{font-style:normal}
.dwarn{margin-top:13px;padding:10px 12px;border-radius:9px;background:var(--gold-soft);font-size:.76rem;line-height:1.5;color:var(--ink-2);border-inline-start:3px solid var(--gold)}
.empty{padding:44px 0;text-align:center;color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:1.05rem}

/* alt bilgi */
.foot{margin-top:52px;padding-top:30px;border-top:1px solid var(--line);text-align:center}
.foot .logo{width:min(50%,180px);margin-bottom:20px;opacity:.92}
.foot .bless{font-family:var(--serif);font-style:italic;font-size:1.12rem;color:var(--ink-2);margin:0 0 20px}
[dir=rtl] .foot .bless{font-style:normal}
.fline{font-size:.88rem;color:var(--ink-2);line-height:1.6;margin:0 auto 8px;max-width:32ch}
.fline a{color:var(--gold);text-decoration:none;font-weight:700}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:16px 0 22px}
.sbtn{display:inline-flex;align-items:center;gap:9px;background:var(--raised);border:1px solid var(--line-2);
  color:var(--ink);text-decoration:none;font-weight:700;font-size:.86rem;border-radius:999px;
  padding-block:8px;padding-inline:8px 16px}
.sbtn img{width:26px;height:26px;border-radius:50%;display:block;flex:0 0 auto}
.fsmall{margin:0 0 6px;font-size:.78rem;color:var(--ink-3)}

/* yüzen düğmeler */
.fabs{position:fixed;inset-inline-start:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px}
.fab{width:46px;height:46px;border-radius:50%;border:0;padding:0;background:none;display:grid;place-items:center;
  cursor:pointer;color:#fff;text-decoration:none;overflow:hidden;box-shadow:0 3px 12px var(--shadow),inset 0 0 0 1px rgba(0,0,0,.07)}
.fab img{width:100%;height:100%;display:block}
.fab svg{width:22px;height:22px}
.fab.top{width:36px;height:36px;background:var(--chip);color:var(--ink-2);border:1px solid var(--line-2);box-shadow:none;opacity:0;pointer-events:none;transition:opacity .2s}
.fab.top.on{opacity:1;pointer-events:auto}
.fab.top svg{width:15px;height:15px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--ground);
  padding:11px 18px;border-radius:999px;font-size:.86rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ YÖNETİCİ PANELİ ============ */
.adm{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;flex-direction:column;direction:ltr;font-family:var(--sans)}
.adm-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.adm-top h2{margin:0;font-family:"Alegreya",Georgia,serif;font-size:1.15rem;flex:1}
.adm-tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);background:var(--raised)}
.adm-tabs button{flex:1;padding:11px;border:0;background:none;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer}
.adm-tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.adm-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
.adm-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--raised);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.adm-foot .st{flex:1;font-size:.78rem;color:var(--ink-3)}
.b{border:1px solid var(--line-2);background:var(--raised);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.b.p{background:var(--gold);border-color:var(--gold);color:#fff}
.b.d{color:var(--danger);border-color:var(--danger)}
.b.s{padding:6px 10px;font-size:.76rem}
.b:disabled{opacity:.45;cursor:default}
.adm-search{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--raised);margin-bottom:12px}
.adm-sec{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:1.2rem;margin:18px 0 4px}
.adm-grp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow .n{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .n small{display:block;font-weight:400;color:var(--ink-3);font-size:.72rem}
.arow .p{font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;font-size:.86rem}
.arow.so .n{color:var(--ink-3);text-decoration:line-through}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line-2);border:0;cursor:pointer;flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--wa)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--raised);font-size:.95rem}
.f textarea{min-height:64px;resize:vertical}
.f input[dir=rtl],.f textarea[dir=rtl]{font-family:"Tajawal",sans-serif}
.frow{display:flex;gap:10px}
.frow .f{flex:1}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:.8rem;padding:6px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--raised);cursor:pointer}
.chk input{accent-color:var(--gold)}
.chk label.on{background:var(--gold);border-color:var(--gold);color:#fff}
.pv{width:120px;height:90px;border-radius:10px;object-fit:cover;background:var(--chip);display:block;margin-bottom:8px}
.adm-modal{position:fixed;inset:0;z-index:110;background:var(--ground);display:flex;flex-direction:column;direction:ltr}
.adm-modal .adm-body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.pin{position:fixed;inset:0;z-index:100;background:rgba(34,31,25,.55);display:grid;place-items:center;padding:20px;direction:ltr}
.pin div{background:var(--raised);border-radius:14px;padding:22px 20px;width:min(100%,320px);text-align:center}
.pin h3{margin:0 0 6px;font-family:"Alegreya",Georgia,serif;font-size:1.2rem}
.pin p{margin:0 0 14px;font-size:.8rem;color:var(--ink-3)}
.pin input{width:100%;text-align:center;font-size:1.4rem;letter-spacing:.4em;padding:10px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:12px;background:var(--ground)}
.pin .err{color:var(--danger);font-size:.78rem;margin:-6px 0 10px;min-height:1em}
.pin .row{display:flex;gap:8px}
.pin .row .b{flex:1}
.note{font-size:.78rem;color:var(--ink-3);background:var(--gold-soft);border-radius:8px;padding:10px 12px;margin:0 0 14px;line-height:1.5}

@media (min-width:520px){
  .thumb{width:76px;height:76px;border-radius:14px}
  .thumb svg{width:46px;height:46px}
  .nm{font-size:1.02rem}
  .idin{padding-inline-start:89px}
  .adm,.adm-modal{max-width:760px;left:50%;transform:translateX(-50%);box-shadow:0 0 40px var(--shadow)}
}

);\n  m.querySelector(\"#f_up\").addEventListener(\"click\",()=>{ if(ii>0){ [g.i[ii-1],g.i[ii]]=[g.i[ii],g.i[ii-1]]; ii--; markDirty(); toast(\"Yukarı taşındı\"); } });\n  m.querySelector(\"#f_dn\").addEventListener(\"click\",()=>{ if(ii<g.i.length-1){ [g.i[ii+1],g.i[ii]]=[g.i[ii],g.i[ii+1]]; ii++; markDirty(); toast(\"Aşağı taşındı\"); } });\n  m.querySelector(\"#f_del\").addEventListener(\"click\",()=>{ $(\"f_delc\").hidden=false; });\n  m.querySelector(\"#f_delok\").addEventListener(\"click\",()=>{ g.i.splice(ii,1); markDirty(); close(); toast(\"Ürün silindi\"); });\n  m.querySelector(\"#mok\").addEventListener(\"click\",()=>{\n    it.p=Math.max(0,Math.round(Number($(\"f_p\").value)||0)); it.ic=$(\"f_ic\").value;\n    it.name={tr:$(\"f_ntr\").value.trim(),en:$(\"f_nen\").value.trim(),ar:$(\"f_nar\").value.trim()};\n    it.ing={tr:$(\"f_itr\").value.trim(),en:$(\"f_ien\").value.trim(),ar:$(\"f_iar\").value.trim()};\n    it.a=[...m.querySelectorAll('.chk input:checked')].map(x=>x.value);\n    it.s=$(\"f_s\").value===\"1\"?1:0; it.so=$(\"f_so\").value===\"1\"?1:0;\n    if(removeImg) it.img=\"\"; else if(newImg) it.img=newImg;\n    if(!it.name.tr){ toast(\"Türkçe ürün adı boş olamaz\"); return; }\n    if(!it.name.en) it.name.en=it.name.tr; if(!it.name.ar) it.name.ar=it.name.en;\n    markDirty(); close();\n  });\n}\n\nfunction shrink(file){\n  return new Promise((res,rej)=>{\n    const r=new FileReader(); r.onerror=rej;\n    r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{\n      const MAX=720; let w=im.width,h=im.height; const k=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);\n      const c=document.createElement(\"canvas\"); c.width=w; c.height=h; c.getContext(\"2d\").drawImage(im,0,0,w,h);\n      res(c.toDataURL(\"image/jpeg\",0.72)); }; im.src=r.result; };\n    r.readAsDataURL(file);\n  });\n}\n\nfunction renderSettings(body){\n  const b=ST.brand;\n  body.innerHTML='<div class=\"note\">Bağlantı ve iletişim bilgileri. WhatsA function filter(){
  const q = qEl.value.trim().toLocaleLowerCase("tr");
  let hits = 0;
  menuEl.querySelectorAll(".sec").forEach(sec=>{
    let sv=false;
    sec.querySelectorAll(".grp").forEach(grp=>{
      let gv=false;
      grp.querySelectorAll(".item").forEach(el=>{
        const al = el.dataset.a ? el.dataset.a.split(",") : [];
        const ok = (!q || el.dataset.k.includes(q)) && !al.some(a=>EX.has(a));
        el.hidden=!ok; if(ok){gv=true;hits++}
      });
      grp.hidden=!gv; if(gv)sv=true;
    });
    sec.hidden=!sv;
  });
  const active = q || EX.size;
  emptyEl.hidden = !(active && hits===0);
  $("hits").textContent = active ? T[lang].hit(hits) : "";
  $("clear").hidden = !active;
  $("pbtn").classList.toggle("has", EX.size>0); $("pdot").textContent=EX.size;
  spy();
}

function spy(){
  const y = window.scrollY+56; let cur=null;
  const secs = menuEl.querySelectorAll(".sec");
  secs.forEach(s=>{ if(!s.hidden && s.offsetTop<=y) cur=s.dataset.sec; });
  if(!cur){ const f=[...secs].find(s=>!s.hidden); cur=f?f.dataset.sec:null; }
  [...railEl.children].forEach(c=>{
    const on = c.dataset.go===cur;
    if(on && c.getAttribute("aria-current")!=="true"){
      const target = c.offsetLeft - railEl.clientWidth/2 + c.clientWidth/2;
      railEl.scrollTo({left:target, behavior:"smooth"});
    }
    c.setAttribute("aria-current", on?"true":"false");
  });
  $("totop").classList.toggle("on", window.scrollY>700);
}

function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onerror=rej;
    r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const MAX=720; let w=im.width,h=im.height; const k=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.72)); }; im.src=r.result; };
    r.readAsDataURL(file);
  });
}

async function save(){
  const st=$("admst"), btn=$("admsave"); btn.disabled=true; st.textContent="Yayınlanıyor…";
  const html=renderDoc(ST);
  const mb=(new Blob([html]).size/1048576);
  if(mb>14){ st.textContent="Sayfa çok büyük ("+mb.toFixed(1)+" MB) — bazı fotoğrafları kaldırın."; btn.disabled=false; return; }
  let art=null;
  try{ if(typeof claude!=="undefined" && claude && claude.use) art=await claude.use("artifact"); }catch(e){}
  if(art){
    try{ try{sessionStorage.setItem("kok-saved","1")}catch(e){} await art.publish(html); st.textContent="Yayınlandı, sayfa yenileniyor…"; A.dirty=false; return; }
    catch(e){ try{sessionStorage.removeItem("kok-saved")}catch(x){}
      const code=e&&e.code;
      if(code==="conflict"){ st.textContent="Başka bir sürüm yayınlanmış — sayfa yenileniyor."; return; }
      st.textContent = code==="not_writer"||code==="not_granted" ? "Bu hesabın yayınlama yetkisi yok. Dosyayı indirip kendiniz yükleyebilirsiniz." : "Yayınlanamadı ("+(code||"hata")+"). Dosyayı indirebilirsiniz.";
    }
  } else st.textContent="Bu ortamda doğrudan yayınlama yok — güncel menüyü indirip sitenize yükleyin.";
  const dl=document.createElement("button"); dl.className="b p"; dl.textContent="index.html indir";
  dl.addEventListener("click", ()=>download(html));
  btn.replaceWith(dl);
}
async function download(html){
  let d=null; try{ if(typeof claude!=="undefined"&&claude&&claude.use) d=await claude.use("downloads"); }catch(e){}
  if(d){ try{ await d.save({filename:"index.html",data:html}); toast("İndirildi"); return; }catch(e){} }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download="index.html"; document.body.appendChild(a); a.click(); a.remove();
}
